<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Containerul HUD Principal - Solid, opac și mărit pentru a acoperi tot vechiul HUD din dreapta sus */
        .hud-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 420px;
            background: #0a0a0f; /* Fundal complet solid, fără transparență inestetică */
            border: 2px solid rgba(0, 210, 255, 0.4);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.95), inset 0 0 15px rgba(0, 210, 255, 0.1);
            color: #fff;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .server-name {
            font-weight: 800;
            color: #00d2ff;
            text-transform: uppercase;
            font-size: 16px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        .player-name {
            font-size: 14px;
            color: #d1d1d6;
            font-weight: 600;
        }

        .time-date {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #a0a0a5;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .stats-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 15px;
            align-items: center;
        }

        .stats-row:last-child {
            margin-bottom: 0;
        }

        .label {
            color: #bbb;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .money-cash { color: #30d158; font-weight: 700; font-size: 16px; }
        .money-bank { color: #0a84ff; font-weight: 700; font-size: 16px; }

        /* Secțiunea Bare (HP & Armura) */
        .bars-section {
            margin-top: 12px;
            margin-bottom: 14px;
        }

        .bar-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .bar-container {
            width: 100%;
            height: 11px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .bar-fill-hp {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff453a, #ff375f);
            border-radius: 6px;
            transition: width 0.2s ease-out;
        }

        .bar-fill-ap {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #636366, #aeaeb2);
            border-radius: 6px;
            transition: width 0.2s ease-out;
        }

        /* Caseta Arma */
        .weapon-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 14px;
            border-radius: 10px;
            border-left: 4px solid #ff9f0a;
            border: 1px solid rgba(255,255,255,0.08);
            border-left-width: 4px;
        }

        .weapon-name { font-size: 14px; font-weight: 700; color: #ff9f0a; }
        .weapon-ammo { font-size: 14px; color: #fff; font-weight: 600; }
    </style>
</head>
<body>

    <div class="hud-container">
        <!-- Header Server & Jucator -->
        <div class="hud-header">
            <span class="server-name" id="srv-name">VALOR</span>
            <span class="player-name" id="ply-name">Loading...</span>
        </div>

        <!-- Data si Ora -->
        <div class="time-date">
            <span id="hud-date">--/--/----</span>
            <span id="hud-time">--:--</span>
        </div>

        <!-- Banii Cash & Banca -->
        <div class="stats-box">
            <div class="stats-row">
                <span class="label">Cash:</span>
                <span class="money-cash" id="hud-cash">$0</span>
            </div>
            <div class="stats-row" style="margin-top: 6px;">
                <span class="label">Banca:</span>
                <span class="money-bank" id="hud-bank">$0</span>
            </div>
        </div>

        <!-- Bare HP si Armura -->
        <div class="bars-section">
            <div class="bar-label-row">
                <span style="color: #ff453a;">HP</span>
                <span id="hp-val" style="color: #ff453a;">100%</span>
            </div>
            <div class="bar-container">
                <div class="bar-fill-hp" id="bar-hp"></div>
            </div>

            <div class="bar-label-row" style="margin-top: 6px;">
                <span style="color: #aeaeb2;">ARMURA</span>
                <span id="ap-val" style="color: #aeaeb2;">0%</span>
            </div>
            <div class="bar-container">
                <div class="bar-fill-ap" id="bar-ap"></div>
            </div>
        </div>

        <!-- Arma & Glonte -->
        <div class="weapon-box">
            <span class="weapon-name" id="weap-name">Pumn</span>
            <span class="weapon-ammo" id="weap-ammo">0</span>
        </div>
    </div>

    <script>
        if (typeof cef !== 'undefined') {
            cef.on("updateHUDData", (name, server, time, date, cash, bank, hp, ap, weapon, ammo) => {
                updateHUD(name, server, time, date, cash, bank, hp, ap, weapon, ammo);
            });
        }

        window.updateHUD = function(name, server, time, date, cash, bank, hp, ap, weapon, ammo) {
            try {
                document.getElementById('ply-name').innerText = name;
                document.getElementById('srv-name').innerText = server;
                document.getElementById('hud-time').innerText = time;
                document.getElementById('hud-date').innerText = date;
                
                document.getElementById('hud-cash').innerText = "$" + cash.toLocaleString('ro-RO');
                document.getElementById('hud-bank').innerText = "$" + bank.toLocaleString('ro-RO');

                let cleanHp = Math.min(Math.max(hp, 0), 100);
                let cleanAp = Math.min(Math.max(ap, 0), 100);

                document.getElementById('bar-hp').style.width = cleanHp + "%";
                document.getElementById('hp-val').innerText = Math.round(cleanHp) + "%";

                document.getElementById('bar-ap').style.width = cleanAp + "%";
                document.getElementById('ap-val').innerText = Math.round(cleanAp) + "%";

                document.getElementById('weap-name').innerText = weapon;
                document.getElementById('weap-ammo').innerText = ammo;
            } catch (err) {
                console.error("Eroare la update HUD:", err);
            }
        };
    </script>
</body>
</html>
