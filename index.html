<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Containerul HUD Principal - Mărit și poziționat în dreapta sus */
        .hud-container {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 360px;
            background: rgba(12, 12, 16, 0.85);
            backdrop-filter: blur(8px); /* Efect modern de sticlă mată */
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 1px 15px rgba(0, 210, 255, 0.08);
            color: #fff;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .server-name {
            font-weight: 800;
            color: #00d2ff;
            text-transform: uppercase;
            font-size: 15px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        .player-name {
            font-size: 14px;
            color: #d1d1d6;
            font-weight: 600;
        }

        .time-date {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .stats-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 15px;
            align-items: center;
        }

        .stats-row:last-child {
            margin-bottom: 0;
        }

        .label {
            color: #aaa;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .money-cash { color: #30d158; font-weight: 700; font-size: 16px; text-shadow: 0 0 8px rgba(48, 209, 88, 0.3); }
        .money-bank { color: #0a84ff; font-weight: 700; font-size: 16px; text-shadow: 0 0 8px rgba(10, 132, 255, 0.3); }

        /* Secțiunea Bare (Viață & Armură) */
        .bars-section {
            margin-top: 12px;
            margin-bottom: 12px;
        }

        .bar-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .bar-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .bar-fill-hp {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff453a, #ff375f);
            border-radius: 5px;
            transition: width 0.2s ease-out;
        }

        .bar-fill-ap {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #636366, #aeaeb2);
            border-radius: 5px;
            transition: width 0.2s ease-out;
        }

        /* Caseta Armă */
        .weapon-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 14px;
            border-radius: 10px;
            border-left: 4px solid #ff9f0a;
            border-top: 1px solid rgba(255,255,255,0.04);
            border-right: 1px solid rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .weapon-name { font-size: 14px; font-weight: 700; color: #ff9f0a; }
        .weapon-ammo { font-size: 14px; color: #fff; font-weight: 600; }
    </style>
</head>
<body>

    <div class="hud-container">
        <!-- Header Server & Jucător -->
        <div class="hud-header">
            <span class="server-name" id="srv-name">FATALITY</span>
            <span class="player-name" id="ply-name">Loading...</span>
        </div>

        <!-- Dată și Oră -->
        <div class="time-date">
            <span id="hud-date">--/--/----</span>
            <span id="hud-time">--:--</span>
        </div>

        <!-- Banii Cash & Bancă -->
        <div class="stats-box">
            <div class="stats-row">
                <span class="label">Cash:</span>
                <span class="money-cash" id="hud-cash">$0</span>
            </div>
            <div class="stats-row" style="margin-top: 6px;">
                <span class="label">Bancă:</span>
                <span class="money-bank" id="hud-bank">$0</span>
            </div>
        </div>

        <!-- Bare Viață și Armură -->
        <div class="bars-section">
            <div class="bar-label-row">
                <span style="color: #ff453a;">VIAȚĂ</span>
                <span id="hp-val" style="color: #ff453a;">100%</span>
            </div>
            <div class="bar-container">
                <div class="bar-fill-hp" id="bar-hp"></div>
            </div>

            <div class="bar-label-row" style="margin-top: 6px;">
                <span style="color: #aeaeb2;">ARMURĂ</span>
                <span id="ap-val" style="color: #aeaeb2;">0%</span>
            </div>
            <div class="bar-container">
                <div class="bar-fill-ap" id="bar-ap"></div>
            </div>
        </div>

        <!-- Arma & Gloanțe -->
        <div class="weapon-box">
            <span class="weapon-name" id="weap-name">Pumn</span>
            <span class="weapon-ammo" id="weap-ammo">0</span>
        </div>
    </div>

    <script>
        // Conexiune optimizată cu evenimentul CEF
        if (typeof cef !== 'undefined') {
            cef.on("updateHUDData", (name, server, time, date, cash, bank, hp, ap, weapon, ammo) => {
                updateHUD(name, server, time, date, cash, bank, hp, ap, weapon, ammo);
            });
        }

        // Facem funcția globală ca să poată fi accesată fără probleme
        window.updateHUD = function(name, server, time, date, cash, bank, hp, ap, weapon, ammo) {
            try {
                document.getElementById('ply-name').innerText = name;
                document.getElementById('srv-name').innerText = server;
                document.getElementById('hud-time').innerText = time;
                document.getElementById('hud-date').innerText = date;
                
                document.getElementById('hud-cash').innerText = "$" + cash.toLocaleString('ro-RO');
                document.getElementById('hud-bank').innerText = "$" + bank.toLocaleString('ro-RO');

                // Viață și Armură (delimitate corect 0-100)
                let cleanHp = Math.min(Math.max(hp, 0), 100);
                let cleanAp = Math.min(Math.max(ap, 0), 100);

                document.getElementById('bar-hp').style.width = cleanHp + "%";
                document.getElementById('hp-val').innerText = Math.round(cleanHp) + "%"; // Corectat ghilimelele greșite

                document.getElementById('bar-ap').style.width = cleanAp + "%";
                document.getElementById('ap-val').innerText = Math.round(cleanAp) + "%";

                // Armă și Gloanțe
                document.getElementById('weap-name').innerText = weapon;
                document.getElementById('weap-ammo').innerText = ammo;
            } catch (err) {
                console.error("Eroare la update HUD:", err);
            }
        };
    </script>
</body>
</html>
