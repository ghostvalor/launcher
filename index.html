<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Containerul HUD - Colțul dreapta sus */
        .hud-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(15, 15, 20, 0.95); /* Acoperă fundalul/HUD-ul nativ complet */
            border: 2px solid rgba(0, 200, 255, 0.5);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.8), inset 0px 0px 10px rgba(0, 200, 255, 0.1);
            color: #fff;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .server-name {
            font-weight: bold;
            color: #00c8ff;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .player-name {
            font-size: 13px;
            color: #e0e0e0;
        }

        .time-date {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .money-cash { color: #2ecc71; font-weight: bold; }
        .money-bank { color: #3498db; font-weight: bold; }

        /* Barele de viață și armură */
        .bar-container {
            width: 100%;
            height: 12px;
            background: rgba(250, 250, 250, 0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .bar-fill-hp {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #e74c3c, #c0392b);
            transition: width 0.3s ease;
        }

        .bar-fill-ap {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #bdc3c7, #ecf0f1);
            transition: width 0.3s ease;
        }

        .weapon-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 5px;
            border-left: 3px solid #f39c12;
        }

        .weapon-name { font-size: 13px; font-weight: bold; color: #f1c40f; }
        .weapon-ammo { font-size: 13px; color: #fff; }
    </style>
</head>
<body>

    <div class="hud-container">
        <div class="hud-header">
            <span class="server-name" id="srv-name">FATALITY</span>
            <span class="player-name" id="ply-name">Player</span>
        </div>

        <div class="time-date">
            <span id="hud-date">00/00/0000</span>
            <span id="hud-time">00:00</span>
        </div>

        <div class="stats-row">
            <span>Cash:</span>
            <span class="money-cash" id="hud-cash">$0</span>
        </div>
        <div class="stats-row">
            <span>Bancă:</span>
            <span class="money-bank" id="hud-bank">$0</span>
        </div>

        <!-- Bara Viață -->
        <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:2px;">
            <span>Viață</span>
            <span id="hp-val">100%</span>
        </div>
        <div class="bar-container">
            <div class="bar-fill-hp" id="bar-hp"></div>
        </div>

        <!-- Bara Armură -->
        <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:2px;">
            <span>Armură</span>
            <span id="ap-val">0%</span>
        </div>
        <div class="bar-container">
            <div class="bar-fill-ap" id="bar-ap"></div>
        </div>

        <!-- Arma & Gloanțe -->
        <div class="weapon-box">
            <span class="weapon-name" id="weap-name">Fist</span>
            <span class="weapon-ammo" id="weap-ammo">0 / 0</span>
        </div>
    </div>

    <script>
        // Ascultăm evenimentul trimis din SA-MP CEF Plugin
        if (window.cef) {
            cef.on("updateHUDData", (name, server, time, date, cash, bank, hp, ap, weapon, ammo) => {
                updateHUD(name, server, time, date, cash, bank, hp, ap, weapon, ammo);
            });
        }

        function updateHUD(name, server, time, date, cash, bank, hp, ap, weapon, ammo) {
            document.getElementById('ply-name').innerText = name;
            document.getElementById('srv-name').innerText = server;
            document.getElementById('hud-time').innerText = time;
            document.getElementById('hud-date').innerText = date;
            
            document.getElementById('hud-cash').innerText = "$" + cash.toLocaleString();
            document.getElementById('hud-bank').innerText = "$" + bank.toLocaleString();

            // Viață și Armură
            document.getElementById('bar-hp').style.width = Math.min(Math.max(hp, 0), 100) + "%";
            document.getElementById('hp-val').innerText = Math.round(hp) + "%";

            document.getElementById('bar-ap').style.width = Math.min(Math.max(ap, 0), 100) + "%";
            document.getElementById('ap-val').innerText = Math.round(ap) + "%";

            // Armă și Gloanțe
            document.getElementById('weap-name').innerText = weapon;
            document.getElementById('weap-ammo').innerText = ammo + " Gloanțe";
        }
    </script>
</body>
</html>
