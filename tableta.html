<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Tableta MAI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: rgba(0, 0, 0, 0.8);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .tablet-container {
            width: 750px;
            height: 480px;
            background: #1e1e2f;
            border: 4px solid #3b3b5c;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
        }
        .header {
            background: #2a2a40;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #3b3b5c;
        }
        .content {
            display: flex;
            flex: 1;
            padding: 15px;
            gap: 15px;
        }
        .sidebar {
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input {
            padding: 10px;
            background: #12121c;
            border: 1px solid #4a4a75;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }
        .crimes-list {
            flex: 1;
            background: #151522;
            border: 1px solid #3b3b5c;
            border-radius: 6px;
            overflow-y: auto;
            padding: 5px;
        }
        .crime-item {
            padding: 8px 10px;
            margin-bottom: 4px;
            background: #222238;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .crime-item:hover {
            background: #2f2f50;
        }
        .close-btn {
            background: #d9534f;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .close-btn:hover {
            background: #c9302c;
        }
    </style>
</head>
<body>

    <div class="tablet-container">
        <div class="header">
            <span>DISPATCH // Tableta MAI</span>
            <button class="close-btn" onclick="inchideTableta()">Închide</button>
        </div>
        <div class="content">
            <div class="sidebar">
                <label for="targetInput">ID sau Nume Suspect:</label>
                <input type="text" id="targetInput" placeholder="Ex: 42 sau Alin...">
                <button class="close-btn" style="background: #0275d8;" onclick="cautaSuspect()">Caută / Selectează</button>
            </div>
            <div class="crimes-list" id="crimesList">
                <!-- Aici se vor popula dinamic infracțiunile prin JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Funcție apelată din Pawn pentru a popula lista de infracțiuni în CEF
        function populeazaInfractiuni(listaInfractiuni) {
            const container = document.getElementById('crimesList');
            container.innerHTML = '';
            
            // listaInfractiuni poate fi trimisă ca un array JSON din Pawn
            listaInfractiuni.forEach((crime, index) => {
                const div = document.createElement('div');
                div.className = 'crime-item';
                div.innerHTML = `<strong>${crime.name}</strong> (W: ${crime.wanted}) - ${crime.drept === 1 ? 'Fără drept' : 'Cu drept'}`;
                div.onclick = () => selecteazaInfractiune(index);
                container.appendChild(div);
            });
        }

        function cautaSuspect() {
            const val = document.getElementById('targetInput').value;
            // Trimite datele înapoi în Pawn folosind funcția nativă de CEF din server
            if(typeof engine !== 'undefined') {
                engine.call("CefCautaSuspect", val);
            }
        }

        function selecteazaInfractiune(index) {
            if(typeof engine !== 'undefined') {
                engine.call("CefAplicaWanted", index);
            }
        }

        function inchideTableta() {
            if(typeof engine !== 'undefined') {
                engine.call("CefInchideTableta");
            }
        }
    </script>
</body>
</html>
